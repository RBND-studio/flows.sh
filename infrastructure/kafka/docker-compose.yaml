services:
  kafka:
    image: apache/kafka:4.3.2
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - ${KAFKA_PORT}:9094
    # Named volume so topics, messages and consumer offsets survive `docker compose down`. The image
    # creates /var/lib/kafka/data owned by appuser, which a new volume inherits.
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_CFG_ADVERTISED_LISTENERS}
      KAFKA_LISTENERS: ${KAFKA_CFG_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      # Topics are created by kafka-init. Producers that reconnect before it runs would otherwise
      # auto-create user-events with 1 partition, and kafka-init's --if-not-exists would skip it.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 12
      KAFKA_LOG_ROLL_HOURS: 1
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 4
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      - kafka
    restart: "no"
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092
    volumes:
      - ./create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]

volumes:
  kafka-data:

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}
    external: true
