<svg width="640" height="320" viewBox="0 0 640 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Welcome to Tasker illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="320" rx="20" fill="url(#bg)"/>

  <!-- Decorative dots -->
  <circle cx="70" cy="60" r="6" fill="#C7D2FE"/>
  <circle cx="590" cy="250" r="8" fill="#DDD6FE"/>
  <circle cx="560" cy="70" r="5" fill="#C7D2FE"/>

  <!-- Board card -->
  <g filter="url(#shadow)">
    <rect x="60" y="70" width="420" height="200" rx="16" fill="#FFFFFF"/>
  </g>

  <!-- Board header -->
  <rect x="84" y="94" width="120" height="14" rx="7" fill="#E0E7FF"/>
  <rect x="418" y="92" width="38" height="18" rx="9" fill="url(#accent)"/>

  <!-- Column 1 -->
  <rect x="84" y="128" width="120" height="118" rx="12" fill="#F8FAFC"/>
  <g>
    <rect x="96" y="140" width="96" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="110" cy="157" r="7" fill="#6366F1"/>
    <path d="M107 157l2 2 4-4" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="124" y="152" width="56" height="9" rx="4.5" fill="#E2E8F0"/>
  </g>
  <g>
    <rect x="96" y="182" width="96" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="110" cy="199" r="7" fill="#6366F1"/>
    <path d="M107 199l2 2 4-4" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="124" y="194" width="44" height="9" rx="4.5" fill="#E2E8F0"/>
  </g>

  <!-- Column 2 -->
  <rect x="216" y="128" width="120" height="118" rx="12" fill="#F8FAFC"/>
  <g>
    <rect x="228" y="140" width="96" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="242" cy="157" r="7" fill="#CBD5E1"/>
    <rect x="256" y="152" width="52" height="9" rx="4.5" fill="#E2E8F0"/>
  </g>

  <!-- Column 3 -->
  <rect x="348" y="128" width="120" height="118" rx="12" fill="#F8FAFC"/>
  <g>
    <rect x="360" y="140" width="96" height="34" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="374" cy="157" r="7" fill="#A5B4FC"/>
    <rect x="388" y="152" width="48" height="9" rx="4.5" fill="#E2E8F0"/>
  </g>

  <!-- "All set" checkmark badge -->
  <g filter="url(#shadow)">
    <circle cx="500" cy="200" r="52" fill="url(#accent)"/>
  </g>
  <path d="M476 201l16 16 32-34" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
